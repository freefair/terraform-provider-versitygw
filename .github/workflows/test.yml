name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -v .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -cover -timeout 8m ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  # A mock would only prove the provider agrees with itself. This runs the same
  # steps against a real gateway, started without --admin-port so the admin
  # routes sit on the S3 listener — the layout the endpoint fallback assumes.
  testacc:
    name: Acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      versitygw:
        # Pinned to the release the "Upstream facts" in CLAUDE.md were measured
        # against, so a pull request cannot go red because upstream moved.
        # compat.yml runs weekly against :latest and is where drift shows up;
        # bumping this pin is a deliberate commit that re-checks those facts.
        image: versity/versitygw:v1.7.0
        ports:
          - 7070:7070
        env:
          ROOT_ACCESS_KEY_ID: testaccess
          ROOT_SECRET_ACCESS_KEY: testsecret
          VGW_BACKEND: posix
          # /tmp/vgw is the one directory the image creates (Dockerfile
          # SETUP_DIR/IAM_DIR); the posix backend chdirs into it and refuses
          # a path that does not exist. Without VGW_IAM_DIR the gateway runs
          # in single-account mode and every account route answers 501.
          VGW_BACKEND_ARG: /tmp/vgw
          VGW_IAM_DIR: /tmp/vgw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go test -v -cover -timeout 12m ./...
        env:
          TF_ACC: "1"
          VERSITYGW_ENDPOINT: http://127.0.0.1:7070
          VERSITYGW_ACCESS_KEY: testaccess
          VERSITYGW_SECRET_KEY: testsecret
